# Ethos configuration
# Run `ethos onboard` to configure a provider and model.

gateway:
  host: 127.0.0.1
  port: 8000
  bearer_token: null

capabilities:
  skills:
    # Enable Agent Skills discovery and activation tools.
    enabled: true
    # Maximum bytes read from one SKILL.md frontmatter or instruction file.
    max_skill_file_bytes: 102400
    # Maximum number of skills disclosed for one run.
    max_skills: 200
    # Maximum bytes read from one referenced UTF-8 skill resource.
    max_resource_file_bytes: 102400
    # Maximum bundled resource paths listed when a skill is activated.
    max_resources: 200

  read_only_file_system:
    # Enable workspace-bounded list_files and read_file tools.
    enabled: true
    # Maximum bytes read from one UTF-8 workspace file.
    max_read_file_bytes: 102400
    # Maximum entries returned when listing one workspace directory.
    max_list_file_entries: 1000

runtime:
  # Cancel prolonged reasoning and retry once with reasoning disabled.
  answer_now_after_seconds: 60

provider:
  # Supported providers: openai, google, ollama.
  name: null
  # Model name exposed by the selected provider.
  model_name: null
  # Requested model reasoning: none, low, medium, or high.
  reasoning_effort: none
  # Ollama server root used by LiteLLM.
  ollama_base_url: http://localhost:11434

keys:
  # Only the key for the selected provider is required. Ollama keys are optional.
  openai_api_key: null
  google_api_key: null
  ollama_api_key: null
