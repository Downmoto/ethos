# Ethos capability configuration

global:
  skills:
    # Enable Agent Skills discovery and activation tools.
    enabled: true
    # Maximum bytes read from one SKILL.md frontmatter or instruction file.
    max_skill_file_bytes: 102400
    # Maximum number of skills disclosed for one run.
    max_skills: 200
    # Maximum bytes read from one referenced UTF-8 skill resource.
    max_resource_file_bytes: 102400
    # Maximum bundled resource paths listed when a skill is activated.
    max_resources: 200

  file_system:
    # Enable workspace-bounded filesystem tools.
    enabled: true
    # Maximum bytes returned by one UTF-8 file read.
    max_read_file_bytes: 102400
    # Maximum bytes written to one UTF-8 workspace file.
    max_write_file_bytes: 102400
    # Maximum paths returned by one listing or glob.
    max_file_entries: 1000
    # Maximum matches returned by one content search.
    max_search_matches: 1000
    # Maximum bytes returned by one content search.
    max_search_result_bytes: 102400
    # Maximum bytes accepted in one patch.
    max_patch_bytes: 102400
    # Maximum files affected by one patch.
    max_patch_files: 20

  shell:
    # Enable native-sandboxed shell commands.
    enabled: true
    # Maximum UTF-8 bytes accepted in one command.
    max_command_bytes: 16384
    # Maximum wall-clock seconds for one command.
    max_command_seconds: 120
    # Maximum combined bytes streamed from stdout and stderr.
    max_output_bytes: 102400

# Workspace entries are sparse overrides. Missing fields inherit globally.
workspaces: {}
